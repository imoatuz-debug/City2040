yle><style id="st">/* Layout: a bright "mission board" — the city model sits in a white game card with a HUD strip on top; the company worksheet is a stack of soft cards on the right; stacks on phones. Single light theme by design. */
:root{
 --bg:#EEF2F8; --card:#FFFFFF; --soft:#F4F6FB; --line:#DDE3EE; --ink:#1B2140; --muted:#5D6880; --navy:#2B2A6E; --accent:#F26B1D; --ok:#2E9E5B; --warn:#C77A0A; --sky1:#DDEBFA;
 --f-disp:"Bricolage Grotesque",system-ui,sans-serif; --f-body:"IBM Plex Sans",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace;
 --shadow:0 1px 2px rgba(27,33,64,.06),0 8px 24px rgba(27,33,64,.07);
 color-scheme:light;
}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
*{box-sizing:border-box}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--f-disp);margin:0;text-wrap:balance;line-height:1.1}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-block:16px 8px;max-width:1400px;margin:0 auto}
.brand{display:flex;gap:14px;align-items:center}
.logo{height:46px;width:auto;background:#fff;border-radius:12px;padding:5px 9px;box-shadow:var(--shadow)}
.kick{margin:0;font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600}
h1{font-size:30px;font-weight:700;color:var(--navy)} h1 em{font-style:normal;color:var(--accent)}
.tag{margin:0;font-family:var(--f-mono);font-size:12px;color:var(--navy);background:#fff;border-radius:999px;padding:6px 14px;box-shadow:var(--shadow);font-weight:600}
.wrap{max-width:1400px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;padding-block:12px 32px;align-items:start}
.stage{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);min-width:0;background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:12px;display:flex;flex-direction:column;gap:10px}
canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;border-radius:16px;background:var(--sky1);touch-action:pan-y;cursor:grab}
canvas:active{cursor:grabbing}
.cap{margin:0 4px;font-size:12px;color:var(--muted)}
.hud{display:flex;flex-direction:column;gap:10px}
.hrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.mission{display:flex;align-items:center;gap:8px;background:var(--navy);color:#fff;border-radius:999px;padding:6px 14px 6px 6px;font:600 13px var(--f-mono);letter-spacing:.04em}
.mission b{background:var(--accent);border-radius:999px;padding:3px 9px;font-weight:600}
.prog{flex:1 1 200px;min-width:0;display:flex;flex-direction:column;gap:3px}
.prog small{font:600 11px var(--f-mono);color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.bar{height:12px;border-radius:999px;background:var(--soft);overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#F26B1D,#F6A623);transition:width .4s ease}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stat{background:var(--soft);border-radius:14px;padding:8px 10px;display:flex;gap:8px;align-items:center;min-width:0}
.stat svg{flex:none;width:26px;height:26px}
.stat div{min-width:0} .stat small{display:block;font:600 10.5px var(--f-mono);color:var(--muted);letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat b{font:700 19px var(--f-disp);color:var(--navy);font-variant-numeric:tabular-nums}
.stat em{font-style:normal;font:500 12px var(--f-mono);color:var(--muted)}
.panel{min-width:0;display:flex;flex-direction:column;gap:14px}
.tabs{display:flex;gap:6px;background:var(--card);border-radius:16px;padding:6px;box-shadow:var(--shadow)}
.tab{flex:1;font:600 14px var(--f-body);color:var(--muted);background:none;border:0;border-radius:11px;padding:10px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--navy);color:#fff}
.pane{display:flex;flex-direction:column;gap:14px}
.sec{display:flex;flex-direction:column;gap:8px}
h2{font-size:24px;color:var(--navy)} h3{font-size:15px}
.lede{margin:0;color:var(--muted);max-width:60ch}
.hint{margin:0;font-size:13px;color:var(--muted)} .pad{padding:8px 0}
.card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:14px}
.roster{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.co{display:flex;gap:10px;align-items:center;background:var(--card);border-radius:14px;padding:8px 10px;min-width:0;box-shadow:var(--shadow)}
.co div{min-width:0;flex:1} .co b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .co small{color:var(--muted);font-size:12px}
.co:not(.on){box-shadow:none;background:transparent;border:1.5px dashed var(--line)} .co:not(.on) b{color:var(--muted);font-weight:400}
.emb{flex:none;width:38px;height:42px;display:grid;place-items:center;font:700 14px var(--f-disp);color:#fff;background:var(--g);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.co:not(.on) .emb{background:var(--line);color:var(--muted)}
.emb.big{width:58px;height:64px;font-size:20px}
.ctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{font:600 14px var(--f-body);color:#fff;background:var(--navy);border:0;border-radius:999px;padding:11px 20px;cursor:pointer;box-shadow:0 6px 16px rgba(43,42,110,.25)}
.btn.ghost{background:#fff;color:var(--navy);border:1.5px solid var(--line);box-shadow:none} .btn.sm{padding:6px 12px;font-size:12px}
.btn.orange{background:var(--accent);box-shadow:0 6px 16px rgba(242,107,29,.3)}
.btn:hover{filter:brightness(1.06)} .btn:disabled{opacity:.4;cursor:not-allowed;filter:none;box-shadow:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.gpick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:8px}
.gb{font:700 14px var(--f-body);color:var(--gt);background:#fff;border:2px solid var(--g);border-radius:12px;padding:6px 4px;cursor:pointer;line-height:1.15}
.gb small{display:block;font:600 10.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;opacity:.75}
.cpick{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:8px 0 4px}.cpl{font:600 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.cb{font:700 14px var(--f-mono);color:var(--navy);background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:6px 13px;cursor:pointer}.cb[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.gb[aria-pressed="true"]{background:var(--g);color:#fff}
.who{display:flex;gap:12px;align-items:center}
.who h3{font-size:20px;color:var(--navy)} .who small{color:var(--muted)}
.badges{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.bd{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding:8px 4px;border-radius:14px;background:var(--soft);color:var(--muted);font-size:11.5px;line-height:1.2}
.bd svg{width:34px;height:34px;filter:grayscale(1);opacity:.35}
.bd.on{background:#FFF4EA;color:var(--ink)} .bd.on svg{filter:none;opacity:1}
.bd b{font:600 12px var(--f-body)}
.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
input,textarea,select{font:500 15px var(--f-mono);color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;min-width:0}
select{width:auto;padding:7px 6px;font-size:14px}
input:focus,textarea:focus,select:focus{border-color:var(--navy);outline:none}
textarea{font-size:13px;resize:vertical;word-break:break-all}
.team{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.team .wide{grid-column:1/-1}
.stabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stb{text-align:left;background:var(--card);border:2px solid transparent;border-radius:16px;padding:10px 12px;cursor:pointer;color:var(--ink);display:flex;flex-direction:column;gap:2px;min-width:0;box-shadow:var(--shadow)}
.stb[aria-selected="true"]{border-color:var(--u)}
.stb small{font:600 11px var(--f-mono);color:var(--ut);letter-spacing:.04em;text-transform:uppercase} .stb b{font:700 15px var(--f-disp)} .stb i{font:600 12px var(--f-mono);font-style:normal;color:var(--muted)} .stb i.ok{color:var(--ok)}
.ex{background:#FFF8E8;border-radius:14px;padding:10px 14px}.ex summary{cursor:pointer;font-weight:600;font-size:14px;color:#8A5A00}.ex p{margin:6px 0 2px;font-size:14px;color:var(--ink);font-family:var(--f-mono)}
.gridwrap{overflow-x:auto}
.tg{display:grid;grid-template-columns:repeat(5,minmax(70px,1fr));gap:8px}
.tile{background:var(--card);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:6px;min-width:0;box-shadow:var(--shadow);border-top:5px solid var(--z,var(--line))}
.tile.lake{background:#EAF4FD}
.tn{font:700 13px var(--f-mono);display:flex;justify-content:space-between;align-items:center;gap:4px;color:var(--navy)}
.lk{font:600 10px var(--f-body);color:#1F6FB0;text-transform:uppercase;letter-spacing:.05em}
.mini{display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--muted)} .mini input{padding:6px;font-size:14px}
.zs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.zb{font:700 12px var(--f-mono);color:var(--zt);background:#fff;border:1.5px solid var(--z);border-radius:8px;padding:4px 0;cursor:pointer}
.zb[aria-pressed="true"]{background:var(--z);color:#fff}
.sw{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.swb{aspect-ratio:1;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1.5px var(--line);background:var(--c);cursor:pointer;padding:0}
.swb[aria-pressed="true"]{box-shadow:0 0 0 2.5px var(--navy)}
.nb{margin:0;font-size:11px;color:var(--muted)}
.ans{display:flex;flex-direction:column;gap:10px}
.ans h3{font-size:12px;font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.wrow{display:flex;gap:6px;align-items:flex-end;flex-wrap:wrap}.wl{font:600 12px var(--f-mono);color:var(--navy);min-width:96px;padding-bottom:10px}.grow{flex:1 1 140px}.wrow .mini{min-width:80px}
.ft{width:100%;border-collapse:collapse;font-size:13px} .ft th{font:600 11px var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.04em;text-align:left;padding:4px 6px}
.ft td{padding:4px 6px;border-top:1px solid var(--line)} .ft .n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap} .ft input{padding:6px;font-size:14px}
.zd{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--z);margin-right:6px}
.chk{display:flex;flex-direction:column;gap:6px}
.chk h3{font-size:12px;font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.ck{display:flex;gap:8px;font-size:14px;color:var(--muted)} .ck span{flex:none;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;background:#FCEBD3;color:var(--warn)} .ck.ok{color:var(--ink)} .ck.ok span{background:#DDF3E6;color:var(--ok)}
.send{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:linear-gradient(135deg,#2B2A6E,#3D3A93);color:#fff;border-radius:18px;padding:14px 16px;box-shadow:var(--shadow)}
.send b{display:block;font-family:var(--f-disp);font-size:17px} .send small{color:#D6D8F0;font-size:13px} .send>div{min-width:0;flex:1 1 220px}
.send .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.4)}
#codebox{display:flex;flex-direction:column;gap:8px}
.tagline{margin:0;font:600 12px var(--f-mono);letter-spacing:.06em;color:var(--accent)}
.next{margin:0;padding-left:20px;font-size:14px;display:flex;flex-direction:column;gap:2px}
.note{margin:0;font-size:13px;background:#FFF4EA;border-radius:10px;padding:8px 12px}
.prev{display:flex;flex-direction:column;gap:8px}
.co.col{flex-direction:column;align-items:stretch;gap:4px}.co.col>.rowh{flex:none}.rowh{display:flex;gap:10px;align-items:center}.roles{color:var(--muted);font-size:12px}
.fails{margin:6px 0 0;padding-left:18px;font-size:13px;color:var(--warn)}
.sub{margin-top:6px}
@media (max-width:900px){.wrap{grid-template-columns:minmax(0,1fr)}.stage{position:static}}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.badges{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.gpick{grid-template-columns:repeat(2,minmax(0,1fr))}.roster{grid-template-columns:minmax(0,1fr)}.stb b{font-size:13px}h1{font-size:24px}.team{grid-template-columns:repeat(2,minmax(0,1fr))}.wl{min-width:100%;padding-bottom:0}}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
@media (max-width:560px){.tg{grid-template-columns:repeat(2,minmax(0,1fr))}.swb{min-width:22px}}

/* per-box feedback */
input.bad,select.bad{border-color:#D92D20!important;background:#FFF5F4;box-shadow:0 0 0 2px rgba(217,45,32,.15)}
input.ok,select.ok{border-color:#2E9E5B!important;background:#F2FBF5}
.fb{display:block;flex-basis:100%;color:#B42318;font:600 12px/1.3 var(--f-body);margin-top:3px}
.ck.bad{color:#B42318} .ck.bad span{background:#FDE2E1;color:#B42318}

.cvw{position:relative;min-width:0}.zoom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;align-items:center;gap:4px;background:rgba(255,255,255,.92);border-radius:14px;padding:6px;box-shadow:var(--shadow)}
.zb{width:38px;height:38px;border:0;border-radius:10px;background:#EEF1F8;color:#1B2140;font:700 20px/1 var(--f-disp),sans-serif;cursor:pointer}.zb:hover{background:#DDE3F2}.zb:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
#zlvl{font:600 11px var(--f-mono),monospace;color:var(--muted)}
@media (max-width:900px){.zoom{flex-direction:row;right:6px;bottom:6px;padding:3px;gap:3px;border-radius:10px}.zb{width:28px;height:28px;font-size:15px;border-radius:8px}#zlvl{display:none}}

const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const eout=t=>{t=clamp(t);return 1-Math.pow(1-t,3)};
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const hexC={};function hex(h){if(hexC[h])return hexC[h];const s=h.replace("#","");return hexC[h]=[parseInt(s.slice(0,2),16),parseInt(s.slice(2,4),16),parseInt(s.slice(4,6),16)]}
function mix(a,b,t){const A=hex(a),B=hex(b);return"#"+A.map((v,i)=>Math.round(lerp(v,B[i],clamp(t))).toString(16).padStart(2,"0")).join("")}
let NIGHT=0;
function shade(col,f){const A=hex(col);const n=lerp(1,0.42,NIGHT);const tint=[lerp(1,.80,NIGHT),lerp(1,.86,NIGHT),lerp(1,1.12,NIGHT)];return`rgb(${A.map((v,i)=>Math.round(clamp(v*f*n*tint[i],0,255))).join(",")})`}
function rgba(col,a){const A=hex(col);return`rgba(${A[0]},${A[1]},${A[2]},${a})`}
function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
function hsh(a,b,c=0){let h=(a*374761393+b*668265263+c*2147483647)>>>0;h=(h^(h>>>13))*1274126177>>>0;return((h^(h>>>16))>>>0)/4294967296}
function font(fam,size,w=400){g.font=`${w} ${size}px ${fam}`}
function txt(s,x,y,col,al="left",base="alphabetic"){g.fillStyle=col;g.textAlign=al;g.textBaseline=base;g.fillText(s,x,y)}
function rrect(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function poly(pts,fill,stroke,lw=1){g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.closePath();if(fill){g.fillStyle=fill;g.fill()}if(stroke){g.strokeStyle=stroke;g.lineWidth=lw;g.stroke()}}

function rot(x,z){const dx=x-CAM.tx,dz=z-CAM.tz,c=Math.cos(CAM.yaw),s=Math.sin(CAM.yaw);return[dx*c-dz*s,dx*s+dz*c]}
function P(x,y,z){const[rx,rz]=rot(x,z);return[CAM.ox+CAM.s*rx,CAM.oy+CAM.s*(rz*Math.sin(CAM.pitch)-(y-CAM.ty)*Math.cos(CAM.pitch))]}
const depthOf=(x,z)=>rot(x,z)[1];
const LIGHT=(()=>{const v=[-0.5,1,-0.65];const n=Math.hypot(...v);return v.map(a=>a/n)})();
const SHX=0.42,SHZ=0.55; // shadow offset per unit height
function faceLight(n){return .56+.44*Math.max(0,n[0]*LIGHT[0]+n[1]*LIGHT[1]+n[2]*LIGHT[2])}
function visible(n){const c=Math.cos(CAM.yaw),s=Math.sin(CAM.yaw);const rz=n[0]*s+n[2]*c;return rz*Math.cos(CAM.pitch)+n[1]*Math.sin(CAM.pitch)>1e-4}

 {n:[0,0,1],p:[[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]]},

 {n:[-1,0,0],p:[[x0,y0,z0],[x0,y0,z1],[x0,y1,z1],[x0,y1,z0]]}]}
const fpt=(f,s,y)=>{const a=f.p[0],b=f.p[1];return P(lerp(a[0],b[0],s),y,lerp(a[2],b[2],s))};

function drawBox(b){const{x0,x1,y0,y1,z0,z1,col,o}=b;
 const al=o.alpha??1;if(al<1){g.save();g.globalAlpha*=al}
 for(const f of sideFaces(x0,x1,y0,y1,z0,z1)){if(!visible(f.n))continue;

   poly(pts,shade(C.rock,L),null);

 }
 if(visible([0,1,0])){const tp=[[x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1]].map(q=>P(...q));

function drawWindows(f,y0,y1,w,L){const fh=3*HS;const rows=Math.floor((y1-y0-w.base)/fh);if(rows<1)return;

 if(w.mull){g.strokeStyle=`rgba(255,255,255,${0.10*(1-night)})`;g.lineWidth=1;g.beginPath();for(let c=1;c<w.cols;c++){const a=fpt(f,c/w.cols,y0+w.base),b=fpt(f,c/w.cols,y1);g.moveTo(...a);g.lineTo(...b)}g.stroke()}}

function decorateTile(b,tp){const{x0,x1,y1,z0,z1,o}=b;const T=o.tile;const y=y1;
 g.save();g.beginPath();tp.forEach((p,i)=>i?g.lineTo(...p):g.moveTo(...p));g.closePath();g.clip();
 const zw=T.zw; // zoning weight
 // sand ripples (fade as land is zoned)
 if(T.zone!=="W"&&zw<1){g.strokeStyle=`rgba(150,110,60,${0.35*(1-zw)})`;g.lineWidth=1.3;
  for(let k=0;k<4;k++){g.beginPath();for(let q=0;q<=10;q++){const x=lerp(x0,x1,q/10);const z=lerp(z0,z1,(k+0.5)/4)+0.035*Math.sin(x*8+T.j*2+k);const p=P(x,y,z);q?g.lineTo(...p):g.moveTo(...p)}g.stroke()}}
 if(zw>0){g.globalAlpha=zw;const ins=0.075;
  const inner=[[x0+ins,y,z0+ins],[x1-ins,y,z0+ins],[x1-ins,y,z1-ins],[x0+ins,y,z1-ins]].map(q=>P(...q));
  if(T.zone==="H"||T.zone==="S"||T.zone==="U"){poly(tp,shade(C.road,1),null);poly(inner,shade(ZCOL[T.zone],1),null);
   // kerb line
   poly(inner,null,shade("#FFFFFF",.75),1);
   // lane dashes along the 4 edges
   g.strokeStyle=rgba("#F2E6C8",.55*(1-NIGHT*0.3));g.lineWidth=1;g.setLineDash([4,5]);g.beginPath();
   [[x0+0.012,z0,x0+0.012,z1],[x1-0.012,z0,x1-0.012,z1],[x0,z0+0.012,x1,z0+0.012],[x0,z1-0.012,x1,z1-0.012]].forEach(([a,c,d,e])=>{const p1=P(a,y,c),p2=P(d,y,e);g.moveTo(...p1);g.lineTo(...p2)});g.stroke();g.setLineDash([]);
   if(NIGHT>0){g.strokeStyle=rgba(C.lit,.55*NIGHT);g.lineWidth=2;g.beginPath();[[x0+.035,z0,x0+.035,z1],[x0,z0+.035,x1,z0+.035]].forEach(([a,c,d,e])=>{g.moveTo(...P(a,y,c));g.lineTo(...P(d,y,e))});g.stroke()}
   if(T.zone==="H"){g.strokeStyle="rgba(0,0,0,.08)";g.lineWidth=1;g.beginPath();for(let k=1;k<4;k++){const s=lerp(x0+ins,x1-ins,k/4);g.moveTo(...P(s,y,z0+ins));g.lineTo(...P(s,y,z1-ins));const t2=lerp(z0+ins,z1-ins,k/4);g.moveTo(...P(x0+ins,y,t2));g.lineTo(...P(x1-ins,y,t2))}g.stroke()}
  }
  if(T.zone==="P"){poly(tp,shade(C.grass,1),null);const r=rng(T.i*31+T.j*7);
   for(let k=0;k<14;k++){const p=P(lerp(x0,x1,r()),y,lerp(z0,z1,r()));g.fillStyle=shade(r()<.5?"#5F9348":"#9CC774",1);g.beginPath();g.arc(p[0],p[1],1.6+r()*1.6*CAM.s/72,0,7);g.fill()}
   // footpath
   g.strokeStyle=shade("#E4D6B6",1);g.lineWidth=Math.max(1.5,CAM.s/40);g.beginPath();for(let q=0;q<=8;q++){const x=lerp(x0,x1,q/8),z=lerp(z0,z1,.5)+0.12*Math.sin(q*0.9+T.i);const p=P(x,y,z);q?g.lineTo(...p):g.moveTo(...p)}g.stroke()}
  g.globalAlpha=1}
 // highlight pulse (Unit 2)
 if(T.hl>0){poly(tp,rgba(ZKEY[T.zone],.55*T.hl),null)}
 // shadows falling onto this tile
 if(SHADOWS.length&&T.zone!=="W"){g.fillStyle=`rgba(20,22,40,${0.26*(1-NIGHT)})`;for(const s of SHADOWS){if(s.bx1<x0||s.bx0>x1||s.bz1<z0||s.bz0>z1)continue;g.beginPath();s.pts.forEach(([x,z],i)=>{const p=P(x,y,z);i?g.lineTo(...p):g.moveTo(...p)});g.closePath();g.fill()}}
 g.restore()}

function drawRoof(b){const{x0,x1,y1,z0,z1,o}=b;const ins=0.06,y=y1+0.001;const q=[[x0+ins,y,z0+ins],[x1-ins,y,z0+ins],[x1-ins,y,z1-ins],[x0+ins,y,z1-ins]].map(p=>P(...p));
 if(o.roof==="solar"){poly(q,shade(C.solar,1),null);g.strokeStyle=shade(C.solarHi,1);g.lineWidth=1;g.beginPath();for(let k=1;k<4;k++){const s=lerp(x0+ins,x1-ins,k/4);g.moveTo(...P(s,y,z0+ins));g.lineTo(...P(s,y,z1-ins))}const m=(z0+z1)/2;g.moveTo(...P(x0+ins,y,m));g.lineTo(...P(x1-ins,y,m));g.stroke();

 else if(o.roof==="garden"){poly(q,shade(C.garden,1),null);const r=rng(Math.floor(x0*10+z0*100));for(let k=0;k<6;k++){const p=P(lerp(x0+ins,x1-ins,r()),y,lerp(z0+ins,z1-ins,r()));g.fillStyle=shade("#4F8A42",1);g.beginPath();g.arc(p[0],p[1],2.5*CAM.s/72,0,7);g.fill()}}
 else if(o.roof==="crown"){poly(q,shade("#9FB9CC",1),null);if(NIGHT>0){const c=P((x0+x1)/2,y,(z0+z1)/2);g.fillStyle=rgba("#FF5A4A",NIGHT*(0.5+0.5*Math.sin(TNOW*4)));g.beginPath();g.arc(c[0],c[1],3,0,7);g.fill()}}}

function drawCyl(c){const N=24,{cx,cz,r,y0,y1,col,o}=c;
 for(let k=0;k<N;k++){const a0=k/N*Math.PI*2,a1=(k+1)/N*Math.PI*2,am=(a0+a1)/2;const n=[Math.cos(am),0,Math.sin(am)];if(!visible(n))continue;
  const pts=[[cx+r*Math.cos(a0),y0,cz+r*Math.sin(a0)],[cx+r*Math.cos(a1),y0,cz+r*Math.sin(a1)],[cx+r*Math.cos(a1),y1,cz+r*Math.sin(a1)],[cx+r*Math.cos(a0),y1,cz+r*Math.sin(a0)]].map(q=>P(...q));
  poly(pts,shade(col,faceLight(n)),shade(col,faceLight(n)),1)}
 if(o.bands){g.strokeStyle="rgba(0,0,0,.18)";g.lineWidth=1;for(let y=y0+0.12;y<y1-0.02;y+=0.12){g.beginPath();for(let k=0;k<=N;k++){const a=k/N*Math.PI*2;const n=[Math.cos(a),0,Math.sin(a)];const p=P(cx+r*Math.cos(a),y,cz+r*Math.sin(a));(k&&visible(n))?g.lineTo(...p):g.moveTo(...p)}g.stroke()}}

 const b=P(x,y0,z),t=P(...top);g.strokeStyle=shade(C.trunk,1);g.lineWidth=Math.max(1.5,CAM.s*0.022*s);g.lineCap="round";g.beginPath();g.moveTo(...b);g.quadraticCurveTo(b[0]+3,(b[1]+t[1])/2,t[0],t[1]);g.stroke();

  const mid=P(top[0]+dx*len*.55,top[1]+0.04*s,top[2]+dz*len*.55),tip=P(top[0]+dx*len,top[1]-0.07*s,top[2]+dz*len);
  const px=-dz*0.05*s,pz=dx*0.05*s;const m1=P(top[0]+dx*len*.5+px,top[1]+0.03*s,top[2]+dz*len*.5+pz),m2=P(top[0]+dx*len*.5-px,top[1]+0.03*s,top[2]+dz*len*.5-pz);
  g.fillStyle=shade(k%2?C.palm:C.palm2,0.85+0.3*Math.max(0,-dx*0.5-dz*0.5));g.beginPath();g.moveTo(...t);g.quadraticCurveTo(...m1,...tip);g.quadraticCurveTo(...m2,...t);g.fill()}}
function drawTree(fl,h,y0){const{x,z,s}=fl;const c=P(x,y0+h*0.65,z),b=P(x,y0,z);g.strokeStyle=shade(C.trunk,1);g.lineWidth=Math.max(1.5,CAM.s*.02);g.beginPath();g.moveTo(...b);g.lineTo(...c);g.stroke();

 const L=0.55*clamp(h/1.4);for(let k=0;k<3;k++){const a=t*2.2+k*2.094;const tip=P(cx+Math.cos(a)*L*0.75,y0+h+Math.sin(a)*L,cz-Math.cos(a)*L*0.45);

function drawSolarFarm(i,j,y,al){g.save();g.globalAlpha*=al;for(let r=0;r<4;r++){const z=j+0.18+r*0.19;const a=[i+.12,y+0.03,z],b=[i+.88,y+0.03,z],c=[i+.88,y+0.1,z+0.1],d=[i+.12,y+0.1,z+0.1];

function hull(pts){pts=pts.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);const lo=[],up=[];for(const p of pts){while(lo.length>=2&&cr(lo[lo.length-2],lo[lo.length-1],p)<=0)lo.pop();lo.push(p)}for(const p of pts.reverse()){while(up.length>=2&&cr(up[up.length-2],up[up.length-1],p)<=0)up.pop();up.push(p)}return lo.slice(0,-1).concat(up.slice(0,-1))}
function addShadowBox(x0,x1,z0,z1,h){if(h<=0.01)return;const dx=SHX*h,dz=SHZ*h;const pts=hull([[x0,z0],[x1,z0],[x1,z1],[x0,z1],[x0+dx,z0+dz],[x1+dx,z0+dz],[x1+dx,z1+dz],[x0+dx,z1+dz]]);
 SHADOWS.push({pts,bx0:x0,bx1:x1+dx,bz0:z0,bz1:z1+dz})}

/* ================= build city ================= */
function buildCity(t,S,clipY=Infinity,layers=false){
 OBJ=[];SHADOWS=[];const cut=y=>Math.min(y,clipY);
 addBox(-0.7,GW+0.7,BASEY-0.16,cut(BASEY),-0.7,GD+0.7,C.plate,{top:C.plateTop,dz:-100});
 if(S.p1<=0)return;
 const dimOf=key=>S.focus&&S.focus.key!==key?1-0.5*S.focus.a:1;
 // buildings first (for shadow list)
 const B=[];
 for(let j=0;j<GD;j++)for(let i=0;i<GW;i++){const z=ZONE[j][i];if(!(z==="H"||z==="S")||S.p3<=0)continue;
  let f=floors[i+","+j];if(!f)continue;
  const wb=clamp(S.p3*1.8-((i*7+j*3)%10)/10*0.8);if(wb<=0)continue;
  const y0=topY(ELEV[j][i]);const H_=bh(f)*eout(wb);B.push({i,j,z,f,y0,H:H_})}
 for(const b of B){const fp=b.z==="H"?0.31:0.4;addShadowBox(b.i+.5-fp,b.i+.5+fp,b.j+.5-fp,b.j+.5+fp,b.H)}
 if(S.p6>0){addShadowBox(1.25,1.75,3.25,3.75,0.95*eout(S.p6))}
 // terrain
 for(let j=0;j<GD;j++)for(let i=0;i<GW;i++){
  const w=clamp(S.p1*1.6-(i+j)/(GW+GD)*0.6);if(w<=0)continue;
  const e=ELEV[j][i],z=ZONE[j][i];
  const zw=(z==="W"||z==="E")?0:clamp(S.p2*1.7-(i+(GD-j))/(GW+GD)*0.7);
  const ty=BASEY+(topY(e)-BASEY)*eout(w);
  const band=z==="P"?mix(C.sand,C.grass,zw):z==="W"?C.seabed:mix(C.sand,"#BDB3A2",zw);
  addBox(i,i+1,BASEY,cut(ty),j,j+1,z==="W"?C.seabed:C.sand,{strata:true,band,top:z==="W"?C.seabed:C.sand,tile:{zone:z,zw,i,j,hl:(S.hl[z]||0)},edge:"rgba(0,0,0,.16)"});
  // water volume
  if(z==="W"&&w>0.6){const wl=Math.min(0+S.water,clipY);if(wl>ty+0.002)addBox(i,i+1,ty,wl,j,j+1,C.water,{alpha:0.72,top:"#4C9BD0",ripple:true,edge:"rgba(0,0,0,0)",skip:n=>isW(i+n[0],j+n[2]),dz:0.0004})}
 }
 // buildings
 for(const b of B){const{i,j,z,f,y0,H:Ht}=b;const key=i+","+j;const dim=dimOf(key);const isFocus=S.focus&&S.focus.key===key;
  const seed=i*17+j*31;
  if(z==="H"){const fp=0.31;let col=paint[key]||C.stone;
   addBox(i+.5-fp,i+.5+fp,y0,cut(y0+Ht),j+.5-fp,j+.5+fp,col,{alpha:dim,layers,win:{cols:3,m:.22,base:0.05,col:"#56677A",a:.85,litP:.55,seed},roof:(y0+Ht<=clipY&&Ht>bh(f)*.98)?(hsh(i,j)<.6?"solar":"garden"):null})}
  else{ // podium + glass tower
   const pod=Math.min(Ht,0.5),fpP=0.4,fpT=0.27;let tcol=paint[key]||C.glass;
   if(i===4&&j===3)tcol=mix(C.glass,C.coral,S.t4hot);
   addBox(i+.5-fpP,i+.5+fpP,y0,cut(y0+pod),j+.5-fpP,j+.5+fpP,C.podium,{alpha:dim,layers,win:{cols:4,m:.12,base:0.08,col:"#3E4C5A",a:.9,litP:.8,seed:seed+1}});
   if(Ht>pod)addBox(i+.5-fpT,i+.5+fpT,y0+pod,cut(y0+Ht),j+.5-fpT,j+.5+fpT,tcol,{alpha:dim,layers,dz:0.001,win:{cols:4,m:.06,base:0,col:"#2F4A63",a:.55,litP:.6,seed:seed+2,mull:true},roof:(y0+Ht<=clipY&&Ht>bh(f)*.98)?"crown":null,glow:isFocus?S.focus.a*(0.6+0.4*Math.sin(t*5)):0,glowCol:i===4&&j===3?C.coral:C.stone})}
 }
 // utilities: desal plant, water tank, solar farm, wind turbine
 if(S.p6>0){const p=eout(S.p6);const ud=S.focus&&S.focus.key==="util"?S.focus.a:0;
  const e=topY(ELEV[3][1]);addCyl(1.5,3.5,0.25,e,cut(e+0.95*p),C.steel,{top:"#DCE1E6",bands:true,glow:ud*(0.6+0.4*Math.sin(t*5))});
  const e2=topY(ELEV[2][0]);addBox(0.14,0.86,e2,cut(e2+0.36*p),2.14,2.86,"#D7DCE0",{win:{cols:5,m:.2,base:.06,col:"#5A6E80",a:.8,litP:.7,seed:5},glow:ud*.8,glowCol:C.gold});
  addCyl(0.35,2.35,0.1,e2+0.36*p,cut(e2+0.5*p),"#AFC2CF",{dz:0.01});addCyl(0.65,2.35,0.1,e2+0.36*p,cut(e2+0.5*p),"#AFC2CF",{dz:0.01});
  const e3=topY(ELEV[3][0]);if(clipY>e3)addCustom(()=>drawSolarFarm(0,3,e3,p),0.5,3.5,e3);
  const e4=topY(ELEV[4][1]);if(clipY>e4+0.3)addCustom(()=>drawTurbine(1.5,4.5,e4,1.4*p,t,1),1.5,4.5,e4,0.05);}
 // flora
 if(S.p7>0)for(const fl of flora){const w=clamp(S.p7*1.6-fl.d*0.6);if(w<=0)continue;const e=topY(ELEV[fl.j][fl.i]);if(clipY<e+0.02)continue;
  const h=(fl.palm?0.42:0.32)*fl.s*eout(w);const hh=Math.min(h,clipY-e);
  SHADOWS.push({pts:[...Array(8)].map((_,k)=>[fl.x+0.3*h+0.09*fl.s*Math.cos(k/8*6.28),fl.z+0.4*h+0.09*fl.s*Math.sin(k/8*6.28)]),bx0:fl.x-.1,bx1:fl.x+.4,bz0:fl.z-.1,bz1:fl.z+.4});
  addCustom(()=>fl.palm?drawPalm(fl,hh,e):drawTree(fl,hh,e),fl.x,fl.z,e)}
